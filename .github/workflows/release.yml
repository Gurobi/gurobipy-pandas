# Release workflow
#
# Build a wheel, run full QA workflow, then publish to PyPI if everything
# passes

name: Release

on:
  push:
    tags:
      - v*
  # Manual runs are a dry run: everything except publishing
  workflow_dispatch:

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  build-wheel:
    uses: ./.github/workflows/build-wheel.yml

  test-wheel:
    needs: [code-quality, build-wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        gurobipy: ["~=13.0", "~=14.0"]
        exclude:
          - python: "3.15"
            gurobipy: "~=13.0"
    steps:
      - name: Checkout tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            docs
            .github/actions
      - uses: ./.github/actions/test-wheel
        with:
          python: ${{ matrix.python }}
          gurobipy: ${{ matrix.gurobipy }}

  # Backward-compatibility tests for old Gurobi versions (expired pip license)
  test-wheel-licensed:
    needs: [code-quality, build-wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12"]
        gurobipy: ["~=11.0", "~=12.0"]
    steps:
      - name: Checkout tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            docs
            .github/actions
      - uses: ./.github/actions/test-wheel
        with:
          python: ${{ matrix.python }}
          gurobipy: ${{ matrix.gurobipy }}
          license: ${{ secrets.GUROBI_LICENSE }}

  publish-pypi:
    # Only publish when running on a tag (manual runs on a branch are dry runs)
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish-pypi.yml
    needs: [test-wheel, test-wheel-licensed]
    permissions:
      id-token: write
