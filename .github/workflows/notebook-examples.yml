# Run the example notebooks on ubuntu against the pre-built wheel artifact.
# Only the docs are checked out. Callers must run after build-wheel.

name: Notebook examples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  notebook-examples:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.14"]
        gurobipy: ["~=14.0"]

    steps:
      - name: Checkout docs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docs
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch built wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-artifact
          path: dist
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          python -m pip install gurobipy${{ matrix.gurobipy }}
          python -m pip install dist/*.whl
          python -m pip install -r docs/requirements-examples.txt
      - name: Execute example notebooks
        run: |
          python -m jupytext --set-kernel python3 --execute --to ipynb docs/source/examples/*.md
