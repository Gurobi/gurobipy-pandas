# Upload the built wheel and sdist to PyPI using trusted publishing (OIDC, no
# API token). No tests run, this should be handled via a larger workflow.
# PyPI must have a trusted publisher configured for the *calling* workflow
# (release.yml). The caller must grant `id-token: write`.

name: Publish to PyPI

on:
  workflow_call:

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Fetch wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: wheel-artifact
          path: dist
      - name: Fetch sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist-artifact
          path: dist
      - name: File listing
        run: ls -R
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
