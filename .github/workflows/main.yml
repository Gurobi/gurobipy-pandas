# Regular QA workflow for main and release branches
#
# Tests the wheel against all supported python and Gurobi versions on ubuntu.

name: Test

on:
  push:
    branches:
      - main
      - 'v*'

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  build-wheel:
    needs: [code-quality]
    uses: ./.github/workflows/build-wheel.yml

  # Exhaustive test matrix for recent Gurobi versions
  test-wheel:
    needs: [build-wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        gurobipy: ["~=13.0", "~=14.0"]
        exclude:
          - python: "3.15"
            gurobipy: "~=13.0"
    steps:
      - name: Checkout tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            docs
            .github/actions
      - uses: ./.github/actions/test-wheel
        with:
          python: ${{ matrix.python }}
          gurobipy: ${{ matrix.gurobipy }}

  # Backward-compatibility tests for old Gurobi versions (expired pip license)
  test-wheel-licensed:
    needs: [build-wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12"]
        gurobipy: ["~=11.0", "~=12.0"]
    steps:
      - name: Checkout tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            docs
            .github/actions
      - uses: ./.github/actions/test-wheel
        with:
          python: ${{ matrix.python }}
          gurobipy: ${{ matrix.gurobipy }}
          license: ${{ secrets.GUROBI_LICENSE }}

  notebook-examples:
    uses: ./.github/workflows/notebook-examples.yml
    needs: [build-wheel]

  # readthedocs build needs the jupyter examples artifact
  examples-artifact:
    uses: ./.github/workflows/examples-artifact.yml
    needs: [notebook-examples]

  trigger-rtd-build:
    runs-on: ubuntu-latest
    needs: [examples-artifact]
    steps:
      - name: Trigger RTD build
        env:
          RTD_HOOK_TOKEN: ${{ secrets.RTD_HOOK_TOKEN }}
        run: |
          curl -X POST -d "branches=${{ github.ref_name }}" -d "token=$RTD_HOOK_TOKEN" \
            -d "default_branch=main" \
            https://readthedocs.com/api/v2/webhook/gurobi-optimization-gurobipy-pandas/11030/
