# QA workflow for pull requests (no RTD trigger)
#
# Tests the wheel against min and max supported python versions with
# Gurobi 13 and 14 only (no license file needed).
#
# Using pull_request here. Ideally would use pull_request_target but that
# requires some reworking of the callable workflows to make sure the right
# commit is checked out in each case (TODO).

name: Pull request

on:
  pull_request:
    branches:
      - main
      - 'v*'

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  build-wheel:
    uses: ./.github/workflows/build-wheel.yml

  # Only run versions with a current pip license in PR builds
  test-wheel:
    needs: [build-wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.15"]
        gurobipy: ["~=13.0", "~=14.0"]
        exclude:
          - python: "3.15"
            gurobipy: "~=13.0"
    steps:
      - name: Check out tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            docs
            .github/actions
      - uses: ./.github/actions/test-wheel
        with:
          python: ${{ matrix.python }}
          gurobipy: ${{ matrix.gurobipy }}

  notebook-examples:
    uses: ./.github/workflows/notebook-examples.yml
    needs: [test-wheel]
