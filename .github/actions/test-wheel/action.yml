# Install a pre-built wheel and run the tests against it.
# The wheel must already be available as the "wheel-artifact" artifact, and
# tests must be checked out. The license step runs only if a license is given.

name: Test wheel
description: Install the built wheel and run the unit tests

inputs:
  python:
    description: Python version
    required: true
  gurobipy:
    description: gurobipy version specifier, e.g. "~=13.0" or "==13.0.1"
    required: true
  license:
    description: Gurobi license file contents (optional)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python }}
    - name: Fetch built wheel
      uses: actions/download-artifact@v8
      with:
        name: wheel-artifact
        path: dist
    - name: Install Gurobi license
      if: inputs.license != ''
      shell: bash
      env:
        GUROBI_LICENSE: ${{ inputs.license }}
      run: |
        printf '%s\n' "$GUROBI_LICENSE" > "$RUNNER_TEMP/gurobi.lic"
        echo "GRB_LICENSE_FILE=$RUNNER_TEMP/gurobi.lic" >> "$GITHUB_ENV"
    - name: Install gurobipy
      shell: bash
      run: python -m pip install "gurobipy${{ inputs.gurobipy }}"
    - name: Install wheel
      shell: bash
      run: python -m pip install dist/*.whl
    - name: Run unittests
      shell: bash
      run: python -m unittest discover -v
